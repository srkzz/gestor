{% extends "base.html" %}

{% block title %}
Definir Nova Palavra-passe
{% endblock %}

{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-7 col-lg-5">

        <div class="card glassmorphism-card shadow-lg border-0">
            <div class="card-body p-4 p-md-5">

                <div class="text-center mb-4">
                    <i class="bi bi-shield-lock-fill display-4 text-dark"></i>

                    <h2 class="mt-3 text-dark">
                        Nova palavra-passe
                    </h2>

                    <p class="text-muted">
                        Defina uma nova palavra-passe para a conta.
                    </p>
                </div>

                <form
                    method="POST"
                    action="{{ url_for(
                        'reset_password',
                        token=token
                    ) }}"
                >
                    <input
                        type="hidden"
                        name="csrf_token"
                        value="{{ csrf_token() }}"
                    >

                    <div class="mb-3">
                        <label
                            for="password"
                            class="form-label text-dark fw-semibold"
                        >
                            Nova palavra-passe
                        </label>

                        <input
                            type="password"
                            id="password"
                            name="password"
                            class="form-control bg-white text-dark border-secondary"
                            minlength="8"
                            autocomplete="new-password"
                            required
                        >

                        <div class="form-text">
                            Utilize pelo menos 8 caracteres.
                        </div>
                    </div>

                    <div class="mb-4">
                        <label
                            for="password_confirmation"
                            class="form-label text-dark fw-semibold"
                        >
                            Confirmar nova palavra-passe
                        </label>

                        <input
                            type="password"
                            id="password_confirmation"
                            name="password_confirmation"
                            class="form-control bg-white text-dark border-secondary"
                            minlength="8"
                            autocomplete="new-password"
                            required
                        >
                    </div>

                    <button
                        type="submit"
                        class="btn btn-dark rounded-pill w-100"
                    >
                        <i class="bi bi-check-circle-fill me-2"></i>
                        Alterar palavra-passe
                    </button>
                </form>

            </div>
        </div>

    </div>
</div>
{% endblock %}
