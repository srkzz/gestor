{% extends "base.html" %}

{% block title %}
Recuperar Palavra-passe
{% endblock %}

{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-7 col-lg-5">

        <div class="card glassmorphism-card shadow-lg border-0">
            <div class="text-center mb-4">
                <i class="bi bi-key-fill reset-password-icon text-dark"></i>

                <h2 class="reset-password-title text-dark mt-3 mb-2">
                    Recuperar password
                </h2>

                <p class="reset-password-subtitle text-muted mb-0">
                    Introduza o email associado à sua conta.
                </p>
            </div>

                <form
                    method="POST"
                    action="{{ url_for('forgot_password') }}"
                >
                    <input
                        type="hidden"
                        name="csrf_token"
                        value="{{ csrf_token() }}"
                    >

                    <div class="mb-4">
                        <label
                            for="email"
                            class="form-label text-dark fw-semibold"
                        >
                            Email
                        </label>

                        <input
                            type="email"
                            id="email"
                            name="email"
                            class="form-control bg-white text-dark border-secondary"
                            autocomplete="email"
                            required
                        >
                    </div>

                    <button
                        type="submit"
                        class="btn btn-dark rounded-pill w-100"
                    >
                        <i class="bi bi-envelope-fill me-2"></i>
                        Enviar link de recuperação
                    </button>
                </form>

                <div class="text-center mt-4">
                    <a
                        href="{{ url_for('login') }}"
                        class="text-dark"
                    >
                        <i class="bi bi-arrow-left me-1"></i>
                        Voltar ao login
                    </a>
                </div>

            </div>
        </div>

    </div>
</div>
{% endblock %}
